name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.4.0.0)"
        required: true
        type: string
      changelog:
        description: "Changelog for this release"
        required: true
        type: string

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build-jellyfin:
    if: >-
      github.event_name != 'push' ||
      github.ref != 'refs/heads/main' ||
      !startsWith(github.event.head_commit.message, 'chore: bump version to')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      checksum: ${{ steps.checksum.outputs.checksum }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Release
        run: dotnet build --configuration Release --no-restore

      - name: Get Jellyfin plugin version from csproj
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<JellyfinPluginVersion>)[^<]+' Jellyfin.Plugin.Stash/Stash.csproj)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected Jellyfin plugin version: $VERSION"

      - name: Prepare artifacts
        run: |
          cd Jellyfin.Plugin.Stash/bin/Release/net10.0
          mv Stash.dll Jellyfin.Plugin.Stash.dll
          mv Stash.pdb Jellyfin.Plugin.Stash.pdb

      - name: Create ZIP
        run: |
          cd Jellyfin.Plugin.Stash/bin/Release/net10.0
          zip -j Jellyfin.Plugin.Stash.zip Jellyfin.Plugin.Stash.dll Jellyfin.Plugin.Stash.pdb

      - name: Calculate checksum
        id: checksum
        run: |
          CHECKSUM=$(md5sum Jellyfin.Plugin.Stash/bin/Release/net10.0/Jellyfin.Plugin.Stash.zip | awk '{print $1}')
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "Checksum: $CHECKSUM"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: Jellyfin
          retention-days: 90
          path: Jellyfin.Plugin.Stash/bin/Release/net10.0/Jellyfin.Plugin.Stash.zip

  build-emby:
    if: >-
      github.event_name != 'push' ||
      github.ref != 'refs/heads/main' ||
      !startsWith(github.event.head_commit.message, 'chore: bump version to')
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        run: MSBuild -t:Restore,Build -p:RestorePackagesConfig=true -property:Configuration=Release.Emby

      - name: Rename Files
        run: |
          ren Jellyfin.Plugin.Stash/bin/Release.Emby/netstandard2.1/Stash.dll Emby.Plugins.Stash.dll
          ren Jellyfin.Plugin.Stash/bin/Release.Emby/netstandard2.1/Stash.pdb Emby.Plugins.Stash.pdb

      - name: Create ZIP
        uses: vimtor/action-zip@v1.2
        with:
          files: Jellyfin.Plugin.Stash/bin/Release.Emby/netstandard2.1/Emby.Plugins.Stash.dll Jellyfin.Plugin.Stash/bin/Release.Emby/netstandard2.1/Emby.Plugins.Stash.pdb
          dest: Emby.Plugins.Stash.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: Emby
          retention-days: 90
          path: Emby.Plugins.Stash.zip

  # Development builds on main branch pushes
  deploy-dev:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-jellyfin, build-emby]
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create development release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          prerelease: true
          title: "Development Build"
          files: |
            **/Jellyfin.Plugin.Stash.zip
            **/Emby.Plugins.Stash.zip

  # Versioned releases triggered by tags or workflow_dispatch
  deploy-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build-jellyfin, build-emby]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_CHANGELOG: ${{ github.event.inputs.changelog }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            CHANGELOG="$INPUT_CHANGELOG"
          else
            # Extract version from tag (v1.2.3.4 -> 1.2.3.4)
            VERSION=${GITHUB_REF#refs/tags/v}
            # Release plumbing carries no meaning for someone reading the
            # revision history in the plugin dashboard
            SKIP=(--invert-grep --grep='^chore: update manifest' --grep='^chore: bump .*version')
            # --match keeps the rolling "latest" dev tag out of the range
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "v${VERSION}^" 2>/dev/null || true)
            if [ -n "$PREVIOUS_TAG" ]; then
              RANGE="${PREVIOUS_TAG}..v${VERSION}"
              CHANGELOG=$(git log --no-merges "${SKIP[@]}" --format='- %s' "$RANGE")
              CHANGELOG="${CHANGELOG}

          **Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...v${VERSION}"
            else
              CHANGELOG=$(git log --no-merges "${SKIP[@]}" --format='- %s' "v${VERSION}")
            fi
            [ -n "$CHANGELOG" ] || CHANGELOG="- No changes recorded"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo 'changelog<<CHANGELOG_EOF'
            echo "$CHANGELOG"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Verify artifact versions
        id: artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          JELLYFIN_VERSION=$(grep -oP '(?<=<JellyfinPluginVersion>)[^<]+' Jellyfin.Plugin.Stash/Stash.csproj)
          EMBY_VERSION=$(grep -oP '(?<=<EmbyPluginVersion>)[^<]+' Jellyfin.Plugin.Stash/Stash.csproj)
          if [ "$JELLYFIN_VERSION" != "$VERSION" ]; then
            echo "Release version $VERSION does not match <JellyfinPluginVersion> $JELLYFIN_VERSION" >&2
            exit 1
          fi
          echo "emby_version=$EMBY_VERSION" >> "$GITHUB_OUTPUT"
          echo "Jellyfin artifact: $JELLYFIN_VERSION, Emby artifact: $EMBY_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            Jellyfin plugin ${{ steps.version.outputs.version }} for Jellyfin 12.0 - `Jellyfin.Plugin.Stash.zip`
            Emby plugin ${{ steps.artifacts.outputs.emby_version }} for Emby 4.9 - `Emby.Plugins.Stash.zip`

            ${{ steps.version.outputs.changelog }}
          draft: false
          prerelease: false
          files: |
            **/Jellyfin.Plugin.Stash.zip
            **/Emby.Plugins.Stash.zip

      - name: Update manifest.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANGELOG: ${{ steps.version.outputs.changelog }}
          CHECKSUM: ${{ needs.build-jellyfin.outputs.checksum }}
          REPOSITORY: ${{ github.repository }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SOURCE_URL="https://github.com/${REPOSITORY}/releases/download/v${VERSION}/Jellyfin.Plugin.Stash.zip"

          # Use jq to update manifest.json
          # First remove any existing entry with the same version, then prepend the new one
          jq --arg version "$VERSION" \
             --arg checksum "$CHECKSUM" \
             --arg changelog "$CHANGELOG" \
             --arg timestamp "$TIMESTAMP" \
             --arg sourceUrl "$SOURCE_URL" \
             '.[0].versions = ([{
               "version": $version,
               "checksum": $checksum,
               "changelog": $changelog,
               "targetAbi": "12.0.0.0",
               "sourceUrl": $sourceUrl,
               "timestamp": $timestamp
             }] + [.[0].versions[] | select(.version != $version)])' manifest.json > manifest.tmp.json

          mv manifest.tmp.json manifest.json

          echo "Updated manifest.json:"
          cat manifest.json

      - name: Commit and push manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: update manifest for v${{ steps.version.outputs.version }}" || echo "No changes to commit"
          git push origin HEAD:main
